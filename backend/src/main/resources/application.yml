server:
  port: ${PORT:8080}

spring:
  application:
    name: careernest-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/careernest}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}
    enabled: ${TWILIO_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://careernest.vercel.app}

logging:
  level:
    com.careernest: DEBUG
    org.springframework.security: INFO
